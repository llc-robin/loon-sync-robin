name: Sync & Patch Loon Config

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }}
          fetch-depth: 0

      - name: Download upstream config
        run: |
          curl -fLsS --retry 3 \
            "https://raw.githubusercontent.com/luestr/ProxyResource/refs/heads/main/Tool/Loon/Lcf/zh-CN/Loon_Auto_Select_Config_By_iKeLee.lcf" \
            -o Loon_Auto_Select_Config_By_iKeLee.lcf

      - name: Add custom plugins
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          file = Path("Loon_Auto_Select_Config_By_iKeLee.lcf")

          # 读取原始文件，保留原有换行格式
          content = file.read_bytes().decode("utf-8")
          newline = "\r\n" if "\r\n" in content else "\n"

          plugins = [
              "https://raw.githubusercontent.com/llc-robin/loon-sync-robin/main/RealIP-Bypass-Domain.plugin, enabled=true",
              "https://cdn.jsdelivr.net/gh/fmz200/wool_scripts@main/Loon/plugin/blockAds.plugin, enabled=true",
          ]

          # 定位 [Plugin] 段标题
          match = re.search(r"(?m)^\[Plugin\][ \t]*$", content)
          if not match:
              raise SystemExit("错误：配置文件中不存在 [Plugin] 段，停止修改。")

          start = match.end()

          # 定位下一段标题，例如 [Mitm]
          next_section = re.search(
              r"(?m)^\[[^\]\r\n]+\][ \t]*$",
              content[start:]
          )
          end = start + next_section.start() if next_section else len(content)

          section = content[start:end]

          # 只添加当前 [Plugin] 段中不存在的插件
          additions = []
          for plugin in plugins:
              url = plugin.split(",")[0]
              if url not in section:
                  additions.append(plugin)

          if not additions:
              print("两个插件均已存在，无需修改。")
          else:
              # 将段末尾的换行符暂时分离，避免吞掉 [Mitm] 前的空行
              body = section.rstrip("\r\n")
              trailing = section[len(body):]

              # 在最后一条现有插件后直接添加，不插入额外空行
              if body:
                  body += newline

              updated_section = body + newline.join(additions) + trailing

              content = content[:start] + updated_section + content[end:]
              file.write_bytes(content.encode("utf-8"))

              print(f"新增 {len(additions)} 个插件。")
          PY

      - name: Verify plugins
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          file = Path("Loon_Auto_Select_Config_By_iKeLee.lcf")
          content = file.read_text(encoding="utf-8")

          match = re.search(r"(?m)^\[Plugin\][ \t]*$", content)
          if not match:
              raise SystemExit("验证失败：[Plugin] 段不存在。")

          start = match.end()
          next_section = re.search(
              r"(?m)^\[[^\]\r\n]+\][ \t]*$",
              content[start:]
          )
          end = start + next_section.start() if next_section else len(content)
          section = content[start:end]

          required = [
              "https://raw.githubusercontent.com/llc-robin/loon-sync-robin/main/RealIP-Bypass-Domain.plugin",
              "https://cdn.jsdelivr.net/gh/fmz200/wool_scripts@main/Loon/plugin/blockAds.plugin",
          ]

          for url in required:
              if url not in section:
                  raise SystemExit(f"验证失败：插件未正确写入 [Plugin] 段：{url}")

          print("验证成功：两个插件均存在于 [Plugin] 段。")
          PY

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Loon_Auto_Select_Config_By_iKeLee.lcf
          git diff --cached --quiet || git commit -m "Auto update lcf $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
