name: Sync & Patch Loon Config
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }}
          fetch-depth: 0

      - name: Download upstream config
        run: |
          curl -L "https://raw.githubusercontent.com/luestr/ProxyResource/refs/heads/main/Tool/Loon/Lcf/zh-CN/Loon_Auto_Select_Config_By_iKeLee.lcf" -o Loon_Auto_Select_Config_By_iKeLee.lcf

      - name: Patch 自定义修改
        run: |
          FILE="Loon_Auto_Select_Config_By_iKeLee.lcf"
          sed -i 's|policy=Proxy|policy=HK|g' "${FILE}"
          sed -i '/^\[General\]/a\allow-remote = false' "${FILE}"
          sed -i 's|^remote-script|# remote-script|g' "${FILE}"

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Loon_Auto_Select_Config_By_iKeLee.lcf
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update lcf $(date +'%Y-%m-%d %H:%M')"
          git push
